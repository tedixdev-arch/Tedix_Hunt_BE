name: GeoNames dev import
# Manual, dev-only. Connects to the dev API server with the existing deploy key and uses that
# server's own .env, so database credentials never leave the server or appear in logs.
# check  = read-only connection/migration/permission checks and current region labels.
# import = runs a package already tested by "GeoNames pgAdmin Import Package" once, then verifies.
#   scope romania   = the pinned pre-tested Romania-only package (run 44717227422).
#   scope worldwide = a Worldwide package from a successful packaging run you name (run id + its import.sql sha256).
# The import commits only if every existing Locality and every city-to-Locality link (e.g. Cluj-Napoca) is unchanged.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: check is read-only; import runs the tested import.sql once
        type: choice
        options: [check, import]
        default: check
      scope:
        description: Package to import (import mode only)
        type: choice
        options: [romania, worldwide]
        default: romania
      package_run_id:
        description: Worldwide only — run id of a successful "GeoNames pgAdmin Import Package" run with scope Worldwide
        type: string
        required: false
      package_attempt:
        description: Worldwide only — run attempt of that run (artifact suffix)
        type: string
        required: false
        default: '1'
      package_sha256:
        description: Worldwide only — sha256 of import.sql from that run (import.sql.sha256 in the artifact)
        type: string
        required: false
      confirm:
        description: Required for import — type import-romania-into-tedix-hunt-dev or import-worldwide-into-tedix-hunt-dev
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency: geonames-dev-import
jobs:
  dev:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: tedixhunt-be-dev.anainfo.ai
      DEPLOY_USER: deploy
      DEPLOY_PATH: /var/www/Tedix_Hunt_BE
      MODE: ${{ inputs.mode }}
      SCOPE: ${{ inputs.scope }}
    steps:
      - name: Select package
        if: inputs.mode == 'import'
        env:
          RUN_ID: ${{ inputs.package_run_id }}
          ATTEMPT: ${{ inputs.package_attempt }}
          SHA: ${{ inputs.package_sha256 }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$SCOPE" = romania ]; then
            run=44717227422; name=geonames-pgadmin-romania-only-44717227422-1
            sha=1d1dfc1c60aabc9ec8496875ed5cbe5b5ff29d80f28c03867f8f4f4277c9362f
          else
            [[ "$RUN_ID" =~ ^[0-9]+$ && "$ATTEMPT" =~ ^[0-9]+$ && "$SHA" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Worldwide needs package_run_id, package_attempt and a 64-hex package_sha256"; exit 1; }
            run=$RUN_ID; name="geonames-pgadmin-worldwide-$RUN_ID-$ATTEMPT"; sha=$SHA
          fi
          if [ "$CONFIRM" != "import-$SCOPE-into-tedix-hunt-dev" ]; then echo "::error::Import mode requires confirm=import-$SCOPE-into-tedix-hunt-dev"; exit 1; fi
          printf 'PACKAGE_RUN_ID=%s\nPACKAGE_NAME=%s\nPACKAGE_SHA256=%s\n' "$run" "$name" "$sha" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Download tested package
        if: inputs.mode == 'import'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          run-id: ${{ env.PACKAGE_RUN_ID }}
          github-token: ${{ github.token }}
          path: package
      - name: Verify package checksum and scope
        if: inputs.mode == 'import'
        run: |
          echo "$PACKAGE_SHA256  package/import.sql" | sha256sum -c -
          # The pinned Romania package predates this check; a Worldwide package must declare its scope.
          if [ "$SCOPE" = worldwide ]; then
            node -e "const m=require('./package/manifest.json'); if (m.scope!=='worldwide') { console.error('Package scope is '+m.scope+', not worldwide'); process.exit(1) } console.log('Package: worldwide, '+m.rows+' cities, '+m.bytes+' bytes')"
          fi
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Run on dev server
        run: |
          work="/tmp/tedix-geonames-${GITHUB_RUN_ID}"
          ssh="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes $DEPLOY_USER@$DEPLOY_HOST"
          $ssh "mkdir -m 700 -p $work"
          files=scripts/ci/dev-geonames.mjs
          if [ "$MODE" = import ]; then files="$files package/import.sql"; fi
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes $files "$DEPLOY_USER@$DEPLOY_HOST:$work/"
          $ssh "cd $DEPLOY_PATH && node $work/dev-geonames.mjs $MODE $work/import.sql tedix_hunt; rc=\$?; rm -rf $work; exit \$rc"
