name: Backend validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tedix_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: tedix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tedix_test -d tedix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tedix_test:disposable-ci-only@127.0.0.1:5432/tedix_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare disposable database baseline
        env:
          PGPASSWORD: disposable-ci-only
        run: psql -h 127.0.0.1 -U tedix_test -d tedix_test -f src/db/pre_migration_baseline.sql
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run migrate
      - run: npm test

  deploy-dev:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: dev-deploy
    env:
      DEPLOY_HOST: tedixhunt-be-dev.anainfo.ai
      DEPLOY_USER: deploy
      DEPLOY_PATH: /var/www/Tedix_Hunt_BE
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'dist' \
            --exclude '.env' --exclude 'tsconfig.tsbuildinfo' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Install, build, migrate and restart
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $DEPLOY_PATH && npm ci && npm run build && npm run migrate && printf '%s' '${{ github.sha }}' > dist/revision.txt && sudo -n /usr/bin/systemctl restart tedixhunt-api"

  deploy-production:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: production-deploy
    environment: production
    env:
      DEPLOY_HOST: 77.42.79.192
      DEPLOY_USER: deploy
      DEPLOY_PATH: /var/www/Tedix_Hunt_BE
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_PRODUCTION }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Sync code to server
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'dist' \
            --exclude '.env' --exclude 'tsconfig.tsbuildinfo' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Install, build, migrate and restart
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $DEPLOY_PATH && npm ci && npm run build && npm run migrate && printf '%s' '${{ github.sha }}' > dist/revision.txt && sudo -n /usr/bin/systemctl restart tedixhunt-api"
