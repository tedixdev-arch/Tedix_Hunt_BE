name: Backend validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tedix_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: tedix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tedix_test -d tedix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tedix_test:disposable-ci-only@127.0.0.1:5432/tedix_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
